# hatchling, not setuptools, for one reason: `force-include`. Three things a
# user needs at runtime live outside `src/` because that is where a person
# edits and reads them -- `skill/`, `docs/note-writing-guideline.md` and
# `examples/overlay-minimal/`. setuptools can only package files that sit
# inside the package directory, so a plain `pip install` shipped none of them
# and `l2n install-skill` failed for everyone who had not cloned the repo.
# hatchling maps them into `lecture2notes/_bundled/` at build time, which
# keeps exactly one editable copy of each file in the repository.
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lecture2notes"
version = "0.2.1"
description = "Turn lecture recordings into structured notes, a time-synced viewer and a course hub, with local ASR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jieyu166" }]
keywords = ["lecture", "notes", "asr", "subtitles", "transcription", "obsidian"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "PyYAML>=6.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Breeze-ASR-25 via CTranslate2. Run `l2n convert-model` once to build the CT2 weights.
breeze = [
  "faster-whisper>=1.1.0",
  "ctranslate2>=4.6.1",
  "transformers>=4.40.0",
  "torch>=2.2.0",
]
# Qwen3-ASR open-weight local inference. The upper bound is not caution: qwen-asr
# itself pins transformers to an exact version (4.57.6 as of 0.0.6), so installing
# it alongside `breeze` resolves transformers to that pin for both. torch is not
# declared by qwen-asr at all and must be installed to match the local CUDA.
# `qwen-asr[vllm]` adds the optional vLLM backend.
qwen = ["qwen-asr>=0.0.6,<0.1"]
# whisper.cpp has no Python dependency: supply the binary yourself and point at it
# with --whisper-cpp-bin. This extra exists only as an explicit marker.
whispercpp = []
# Scene-detection capture mode.
scene = ["scenedetect>=0.6.4"]
# Pillow is a test-only dependency: the frame-capture tests synthesise PNG images
# instead of shipping media, and the interval signature helper reads them back.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/jieyu166/lecture2notes"
Repository = "https://github.com/jieyu166/lecture2notes"
Issues = "https://github.com/jieyu166/lecture2notes/issues"

[project.scripts]
l2n = "lecture2notes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture2notes"]

# The three resources that live outside the package, mapped into it. The keys
# are repository paths (the single place a human edits them); the values are
# where `lecture2notes.resources` looks for them in an installed wheel. Do not
# create these copies in the working tree -- `resources` prefers the repository
# originals when it can see them, so a source checkout never reads a stale copy.
[tool.hatch.build.targets.wheel.force-include]
"skill" = "lecture2notes/_bundled/skill"
"docs/note-writing-guideline.md" = "lecture2notes/_bundled/docs/note-writing-guideline.md"
"examples/overlay-minimal" = "lecture2notes/_bundled/examples/overlay-minimal"

# An editable install exposes `src/` directly, where `_bundled/` does not and
# must not exist; `resources` finds the repository originals by walking up.
# Naming the target keeps hatchling from copying force-included files into
# site-packages next to a path hook that would never read them.
[tool.hatch.build.targets.editable]
packages = ["src/lecture2notes"]
force-include = {}

# The sdist carries the repository layout, so `pip install <sdist>` rebuilds a
# wheel with the same mapping and the test suite is runnable from it.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/skill",
  "/docs",
  "/examples",
  "/install.py",
  "/README.md",
  "/ATTRIBUTION.md",
  "/NOTICE",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `packaging` is deselected by default, but not from here: a `-m` in addopts is
# overridden by the `-m` every CI job already passes, which would quietly put
# the slow tests back into the fast run. tests/conftest.py deselects them with a
# collection hook instead, and stands aside as soon as `-m` mentions them.
addopts = "-q"
markers = [
  "gpu: needs a CUDA device and real model weights; skipped everywhere else",
  "packaging: builds a wheel and installs it into a temporary venv. Slow and network-dependent, so deselected by the default addopts; run it with `-m packaging`.",
  "e2e: runs the real pipeline on the committed clip; needs ffmpeg and faster-whisper, and downloads the tiny model on first use. Excluded from the default CI run with -m \"not gpu and not e2e\".",
]
