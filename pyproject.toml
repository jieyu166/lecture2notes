[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture2notes"
version = "0.1.0.dev0"
description = "Turn lecture recordings into structured notes, a time-synced viewer and a course hub, with local ASR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jieyu166" }]
keywords = ["lecture", "notes", "asr", "subtitles", "transcription", "obsidian"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "PyYAML>=6.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Breeze-ASR-25 via CTranslate2. Run `l2n convert-model` once to build the CT2 weights.
breeze = [
  "faster-whisper>=1.1.0",
  "ctranslate2>=4.6.1",
  "transformers>=4.40.0",
  "torch>=2.2.0",
]
# Qwen3-ASR open-weight local inference. Upper bound pinned: the package is tightly
# coupled to transformers and breaks easily on upgrades.
qwen = ["qwen-asr>=0.0.6,<0.1"]
# whisper.cpp has no Python dependency: supply the binary yourself and point at it
# with --whisper-cpp-bin. This extra exists only as an explicit marker.
whispercpp = []
# Scene-detection capture mode.
scene = ["scenedetect>=0.6.4"]
# Pillow is a test-only dependency: the frame-capture tests synthesise PNG images
# instead of shipping media, and the interval signature helper reads them back.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/jieyu166/lecture2notes"
Repository = "https://github.com/jieyu166/lecture2notes"
Issues = "https://github.com/jieyu166/lecture2notes/issues"

[project.scripts]
l2n = "lecture2notes.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lecture2notes = ["profiles/*/*.md", "profiles/*/*.yaml", "profiles/*/*.json", "profiles/*/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
