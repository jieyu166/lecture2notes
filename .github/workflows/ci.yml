# The suite has to pass on both of the platforms this project claims to
# support, and it has to pass on a console that cannot print most of the
# characters the suite writes. Those are different failures, so they are
# different jobs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything the suite writes is read back as UTF-8 by the tests themselves;
  # the cp950 job overrides this on purpose.
  PYTHONIOENCODING: utf-8
  # A traceback is worth more than a spinner in a log nobody is watching.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is a fact about that platform: let the other
      # finish so the report says which.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # ffmpeg is a hard dependency of the frames and transcribe stages, and
      # several tests build a real video with it rather than faking one.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # The Windows runner image ships no ffmpeg. This action fetches a
      # prebuilt gyan.dev binary and caches it, which is minutes faster than
      # `choco install ffmpeg`. It resolves "latest release" through an API
      # call, though, and when that lookup fails the step fails outright --
      # which has nothing to do with the change under test. So it is allowed to
      # fail and chocolatey picks up after it.
      - name: Install ffmpeg (Windows)
        id: ffmpeg
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}

      - name: Install ffmpeg (Windows, fallback)
        if: runner.os == 'Windows' && steps.ffmpeg.outcome == 'failure'
        run: choco install ffmpeg -y --no-progress

      - name: Check ffmpeg is on PATH
        run: ffmpeg -version

      - name: Install the package
        run: python -m pip install -e ".[dev,scene]"

      - name: Run the tests
        run: python -m pytest -q -m "not gpu and not e2e"

  # Rule 1 of this project: console output must survive a cp950 console. That
  # is not a property of the code, it is a property of the code plus the
  # console, so it needs a run of its own on the platform that has one.
  cp950:
    name: windows cp950 console
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Same flaky release lookup as the matrix job; same fallback.
      - name: Install ffmpeg
        id: ffmpeg
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}

      - name: Install ffmpeg (fallback)
        if: steps.ffmpeg.outcome == 'failure'
        run: choco install ffmpeg -y --no-progress

      - name: Install the package
        run: python -m pip install -e ".[dev,scene]"

      - name: Run the tests with a cp950 console
        env:
          PYTHONIOENCODING: cp950
        run: python -m pytest -q -m "not gpu and not e2e"

  # The end-to-end run downloads model weights from Hugging Face, so it fails
  # for reasons that have nothing to do with the change under test. It reports,
  # it does not gate.
  e2e:
    name: end-to-end (real model, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install the package and an ASR engine
        run: |
          python -m pip install -e ".[dev,scene]"
          python -m pip install faster-whisper

      - name: Run the end-to-end test on the committed clip
        run: python -m pytest -q -m e2e

  # v0.2.0 shipped a wheel with no `skill/`, no writing guideline and no overlay
  # example in it, and the whole suite passed, because the suite runs in a
  # checkout where those files are sitting at their repository paths. The only
  # test that can catch that builds the archive and installs it somewhere the
  # checkout is not reachable, so this job exists to run it. It gates: a wheel
  # that cannot deploy its own skill is not a releasable wheel.
  packaging:
    name: wheel install (packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No ffmpeg step: these tests never touch media. `build` is the only
      # extra, and `-e .` is what puts the test helpers on the path -- the test
      # itself builds and installs a non-editable wheel of its own.
      - name: Install the package and the build frontend
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Build a wheel, install it into a clean venv and use it
        run: python -m pytest -q -m packaging
