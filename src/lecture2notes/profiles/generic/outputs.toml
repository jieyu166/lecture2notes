# Output settings for the public generic profile.
# Top-level keys are the output scope itself: `outputs.pbf.is_enabled` reads
# this table directly.

# PotPlayer chapter file. Off here on purpose: a `.pbf` beside a video changes
# what the player does with that video, so the public profile states the off
# answer rather than leaving it to the absent-key default.
pbf = false

[note]
# faithful keeps every quote; concise keeps at most one per section.
style = "concise"

[guideline]
# Severity `l2n check note` reports R5 (transcript paste) at: "warning" or
# "error". A profile whose notes are published verbatim should set "error".
transcript_paste = "warning"
