# Patterns a rendered note must not contain (rule R7 of the writing guideline).
#
# Python regular expressions, written as TOML literal strings so a backslash
# means a backslash and nothing has to be double-escaped.
#
# `patterns` is ONE key. The layers merge key by key, so this list replaces the
# profile's list instead of adding to it -- which is why the two generic
# patterns are restated below rather than assumed. Copy the ones you want to
# keep out of `src/lecture2notes/profiles/generic/privacy.toml`.

patterns = [
  # An e-mail address (restated from the generic profile).
  '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}',
  # A phone number written out with its label (restated from the generic
  # profile).
  '(電話|手機|聯絡電話)\s*[:：]?\s*[\d\-() ]{8,}',
  # Placeholder for something only you would ever write down -- an employee
  # number, a client code, an internal ticket id. Replace it with yours.
  '\bEMP-\d{6}\b',
]
